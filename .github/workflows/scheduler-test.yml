name: Scheduler Test

# Temporary diagnostic workflow.
# Runs every 5 minutes so we can verify that GitHub's schedule
# dispatcher is creating scheduled events for this repository.

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

jobs:
  scheduler-test:
    name: Scheduler heartbeat
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled execution
        run: |
          echo "Scheduled workflow fired successfully."
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
