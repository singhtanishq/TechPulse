name: Collect

# Daily collection pipeline:
# collect -> process -> generate -> validate -> commit.
#
# Schedule:
#   18:30 UTC = 00:00 IST (Asia/Kolkata) on the following day.
#
# Reporting semantics:
#   Reporting date X represents the TechPulse edition for India
#   calendar day X and covers the previous completed IST day (X-1).
#
# The reporting date is resolved centrally by scripts/reporting_date.py.
# It must never be inferred directly from the GitHub runner's execution
# timestamp.
#
# The workflow also runs for changes to scripts/tests so pipeline logic
# changes can regenerate the next pending edition.

on:
  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Reporting date to (re)collect (YYYY-MM-DD, IST edition). Empty = next pending edition."
        required: false
        type: string

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  collect:
    name: Collect and publish data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show environment
        run: |
          python3 --version
          python3 -c "import sys; print('executable:', sys.executable)"

      # ----------------------------------------------------------------
      # Pre-flight validation
      # ----------------------------------------------------------------

      - name: Run offline validation
        run: |
          python3 scripts/validate.py

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v

      # ----------------------------------------------------------------
      # Reporting date
      # ----------------------------------------------------------------

      - name: Determine reporting date (IST)
        id: date
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.snapshot_date }}
        run: |
          set -euo pipefail

          DATE_OUTPUT="$(
            python3 scripts/reporting_date.py \
              --event "$EVENT_NAME" \
              --input-date "$INPUT_DATE"
          )"

          REPORTING_DATE="$(
            printf '%s\n' "$DATE_OUTPUT" |
              sed -n 's/^REPORTING_DATE=//p' |
              head -n 1
          )"

          if [[ ! "$REPORTING_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Could not resolve a valid reporting date (got '$REPORTING_DATE')"
            exit 1
          fi

          # Validate that the value is also a real calendar date.
          if ! python3 - "$REPORTING_DATE" <<'PYEOF'
          import sys
          from datetime import datetime

          value = sys.argv[1]

          try:
              datetime.strptime(value, "%Y-%m-%d")
          except ValueError:
              raise SystemExit(1)
          PYEOF
          then
            echo "::error::Resolved reporting date is not a real calendar date: $REPORTING_DATE"
            exit 1
          fi

          echo "date=$REPORTING_DATE" >> "$GITHUB_OUTPUT"
          echo "::notice::TechPulse reporting date (IST edition): $REPORTING_DATE"

      # ----------------------------------------------------------------
      # Main pipeline
      # ----------------------------------------------------------------

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/run_pipeline.py \
            --date "${{ steps.date.outputs.date }}" \
            --verbose

      # ----------------------------------------------------------------
      # Post-generation validation
      # ----------------------------------------------------------------

      - name: Validate generated output
        run: |
          python3 scripts/validate.py

      # ----------------------------------------------------------------
      # Change detection
      # ----------------------------------------------------------------

      - name: Detect meaningful changes
        id: changes
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful repository changes detected; nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --cached --name-status
          fi

      # ----------------------------------------------------------------
      # Commit and push
      # ----------------------------------------------------------------

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "TechPulse: daily snapshot ${{ steps.date.outputs.date }}"

          # Another workflow/manual push may have landed while this
          # run was collecting. Rebase and retry rather than losing the
          # generated snapshot.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              break
            fi

            echo "Push rejected (attempt $attempt); fetching latest origin/main..."

            git fetch --prune origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase conflict during push retry; aborting rebase"
              git rebase --abort
              exit 1
            fi
          done

          echo "::error::Could not push after 3 attempts"
          exit 1

      # ----------------------------------------------------------------
      # Summary
      # ----------------------------------------------------------------

      - name: Summary
        if: always()
        env:
          REPORTING_DATE: ${{ steps.date.outputs.date }}
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          set -euo pipefail

          {
            echo "## TechPulse collect run"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| Reporting date (IST edition) | \`${REPORTING_DATE:-unresolved}\` |"

            if [[ "${CHANGED:-false}" == "true" ]]; then
              echo "| Changes committed | yes |"
            else
              echo "| Changes committed | no |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f generated/data.json ]]; then
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("generated/data.json")

          try:
              with path.open(encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print()
              print(f"> [!WARNING]")
              print(f"> Could not read generated/data.json for summary: `{exc}`")
              raise SystemExit(0)

          snapshot = data.get("snapshot") or {}
          meta = data.get("meta") or {}

          print()
          print(
              f"Edition: **{meta.get('date')}** (IST) — "
              f"covering IST day **{meta.get('coveredDate')}**"
          )
          print()
          print(f"| CVEs | {snapshot.get('cves', 0)} |")
          print(f"| Known exploited | {snapshot.get('knownExploited', 0)} |")
          print(f"| Releases | {snapshot.get('releases', 0)} |")
          print(f"| Projects | {snapshot.get('projects', 0)} |")
          print(f"| Tech entries | {snapshot.get('techEntries', 0)} |")

          print()
          print("Source health:")

          degraded = False
          sources = data.get("sources") or {}

          if isinstance(sources, dict):
              for group, group_sources in sources.items():
                  if not isinstance(group_sources, dict):
                      continue

                  for name, status_data in group_sources.items():
                      if isinstance(status_data, dict):
                          status = status_data.get(
                              "status",
                              "unknown",
                          )
                      else:
                          status = "unknown"

                      if status in ("failed", "partial"):
                          degraded = True

                      print(
                          f"- {name} ({group}): **{status}**"
                      )

          if degraded:
              print()
              print("> [!WARNING]")
              print(
                  "> One or more sources were unavailable — "
                  "the edition was published with degraded source coverage."
              )
          PYEOF
          fi
